[package]
name = "zendia"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zendia's window, written with Freya"
default-run = "zendia"

[lib]
name = "zendia"
path = "src/lib.rs"

[[bin]]
name = "zendia"
path = "src/main.rs"

[[bin]]
name = "zendia-gallery"
path = "src/bin/gallery.rs"

[dependencies]
async-channel = "2.3"
cpal = "0.15"
freya = { version = "0.5.4", features = ["engine"] }
hub-protocol = { workspace = true }
libc = "0.2"
libipc_rust = { workspace = true }
serde_json = "1"
zendia-automation = { workspace = true }
zendia-browser-core = { workspace = true }
zendia-keymap = { workspace = true }
zendia-module-api = { workspace = true }
