description = "Move Window to Far Left"

[[bindings]]
mode = "w"
keys = "J"
command = "split.edge_down"
description = "Move Window to Bottom"

[[bindings]]
mode = "w"
keys = "K"
command = "split.edge_up"
description = "Move Window to Top"

[[bindings]]
mode = "w"
keys = "L"
command = "split.edge_right"
description = "Move Window to Far Right"

[[bindings]]
mode = "w"
keys = "+"
command = "split.grow_height"
description = "Increase Window Height"

[[bindings]]
mode = "w"
keys = "-"
command = "split.shrink_height"
description = "Decrease Window Height"

[[bindings]]
mode = "w"
keys = ">"
command = "split.grow_width"
description = "Increase Window Width"

[[bindings]]
mode = "w"
keys = "<lt>"
command = "split.shrink_width"
description = "Decrease Window Width"

[[bindings]]
mode = "w"
keys = "g"
command = "split.grab"
description = "Move Window…"

[[bindings]]
mode = "w"
keys = "a"
command = "split.add"
description = "Add Tab to Split…"

[[bindings]]
mode = "w"
keys = "<CR>"
command = "window.drop"
description = "Drop Here"

[[bindings]]
mode = "w"
keys = "<Esc>"
command = "window.escape"
description = "Cancel / Leave Window Mode"

[[bindings]]
mode = "w"
keys = "q"
command = "window.quit"
description = "Leave Window Mode"

[[bindings]]
mode = "w"
keys = "?"
command = "which_key.show_all"
description = "Keymaps (which-key)"
