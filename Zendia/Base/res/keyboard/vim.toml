# Default vim keyboard profile ported from Zendia's LazyVim-inspired keymap.
# Buffers are tabs, tab pages are Zen spaces, windows are split view panes.
# Modes: n (NORMAL), i (INSERT), v (VISUAL), e (EXPLORER), t (TOOLBAR), l (LIBRARY), w (WINDOW).

name = "vim"
description = "Zendia default vim keyboard shortcuts"
leader = "<Space>"

# ---------------------------------------------------------------------------
# Which-key groups
# ---------------------------------------------------------------------------

[[groups]]
mode = "n"
keys = "<leader><Tab>"
name = "spaces"
color = "teal"

[[groups]]
mode = "n"
keys = "<leader>a"
name = "ai"
color = "pink"

[[groups]]
mode = "n"
keys = "<leader>b"
name = "buffer"
color = "blue"

[[groups]]
mode = "n"
keys = "<leader>c"
name = "captcha"
color = "yellow"

[[groups]]
mode = "n"
keys = "<leader>f"
name = "file/find"
color = "cyan"

[[groups]]
mode = "n"
keys = "<leader>o"
name = "library"
color = "teal"

[[groups]]
mode = "n"
keys = "<leader>q"
name = "quit/session"
color = "red"

[[groups]]
mode = "n"
keys = "<leader>s"
name = "search"
color = "green"

[[groups]]
mode = "n"
keys = "<leader>u"
name = "ui"
color = "purple"

[[groups]]
mode = "n"
keys = "<leader>w"
name = "windows"
color = "orange"

[[groups]]
mode = "n"
keys = "["
name = "prev"
color = "purple"

[[groups]]
mode = "n"
keys = "]"
name = "next"
color = "purple"

[[groups]]
mode = "n"
keys = "g"
name = "goto"
color = "purple"

[[groups]]
