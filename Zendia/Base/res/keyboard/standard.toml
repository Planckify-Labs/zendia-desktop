# Standard browser keyboard profile (default when vim mode is off).
# Both Control (<C-...>) and Super/Command (<D-...>) aliases are bound for
# cross-platform browser shortcuts.

name = "standard"
description = "Standard browser keyboard shortcuts"
leader = "<Space>"

[[bindings]]
keys = ["<C-t>", "<D-t>"]
command = "tab.new"
description = "New tab"
args = { activate = true }

[[bindings]]
keys = ["<C-w>", "<D-w>"]
command = "tab.close"
description = "Close tab"

[[bindings]]
keys = ["<C-Tab>", "<C-PageDown>"]
command = "tab.next"
description = "Next tab"

[[bindings]]
keys = ["<C-S-Tab>", "<C-PageUp>"]
command = "tab.previous"
description = "Previous tab"

[[bindings]]
keys = ["<C-l>", "<D-l>", "<A-d>"]
command = "location.focus"
description = "Focus location bar"

[[bindings]]
keys = ["<C-r>", "<D-r>", "<F5>"]
command = "navigation.reload"
description = "Reload page"
args = { bypass_cache = false }

[[bindings]]
keys = ["<C-S-r>", "<D-S-r>", "<C-F5>"]
command = "navigation.reload"
description = "Reload page (bypass cache)"
args = { bypass_cache = true }

[[bindings]]
keys = ["<A-Left>", "<D-[>"]
command = "navigation.back"
description = "Go back"

[[bindings]]
keys = ["<A-Right>", "<D-]>"]
command = "navigation.forward"
description = "Go forward"

# Debug shortcut that cycles sample InputServer events (mode, pending keys, and
# which-key candidates) through the stub backend until InputServer arrives.
[[bindings]]
keys = "<C-A-m>"
command = "debug.cycle_input_state"
description = "Cycle sample vim input state (debug)"

# Menu and window shell shortcuts.
[[bindings]]
keys = ["<A-f>", "<F10>"]
command = "menu.app.toggle"
description = "Toggle application menu"

[[bindings]]
keys = ["<C-n>", "<D-n>"]
command = "window.new"
description = "New window"

[[bindings]]
keys = ["<C-S-n>", "<D-S-n>"]
command = "window.new_blank"
description = "New blank window"

[[bindings]]
keys = ["<C-S-p>", "<D-S-p>"]
command = "window.new_private"
description = "New private window"

[[bindings]]
keys = ["<C-S-y>", "<D-S-y>"]
command = "library.open"
description = "Open downloads"
args = { section = "downloads" }

[[bindings]]
keys = ["<C-S-f>", "<D-S-f>"]
command = "extensions.open"
description = "Extensions and themes"

[[bindings]]
keys = ["<C-p>", "<D-p>"]
command = "page.print"
description = "Print page"

[[bindings]]
keys = ["<C-S-A-s>", "<D-S-A-s>"]
command = "page.save"
description = "Save page as"

[[bindings]]
keys = ["<C-f>", "<D-f>"]
command = "page.find"
description = "Find in page"

[[bindings]]
keys = ["<C-q>", "<D-q>"]
command = "app.quit"
description = "Quit Zendia"

[[bindings]]
keys = ["<C-=>", "<C-+>", "<D-=>", "<D-+>"]
command = "zoom.in"
description = "Zoom in"

[[bindings]]
keys = ["<C-->", "<D-->"]
command = "zoom.out"
description = "Zoom out"

[[bindings]]
keys = ["<C-0>", "<D-0>"]
command = "zoom.reset"
description = "Reset zoom"

# Sidebar spaces and tab management shortcuts (matching Zen defaults).
[[bindings]]
keys = ["<C-A-Right>", "<D-A-Right>"]
command = "space.next"
description = "Next space"

[[bindings]]
keys = ["<C-A-Left>", "<D-A-Left>"]
command = "space.previous"
description = "Previous space"

[[bindings]]
keys = ["<C-S-d>", "<D-S-d>"]
command = "tab.toggle_pin"
description = "Pin or unpin tab"
