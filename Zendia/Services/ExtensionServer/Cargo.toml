[package]
name = "zendia-extension-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hosts the cgx-webext core and the adapter between its typed contract and the Module API."

[[bin]]
name = "zendia-extension-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webext = { workspace = true }
zendia-sandbox = { workspace = true }
zendia-service = { workspace = true }
